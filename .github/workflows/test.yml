name: Build and test

on:
  # run on pull requests
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci
      - run: npm run build
      - run: npm run check-types
      - run: npx playwright install chromium firefox webkit --with-deps
      # caches can't be replaced, so the key must change along with what is
      # installed, e.g. which browsers. hence including this file in the key
      - uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', '.github/workflows/test.yml') }}

  test:
    needs: build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Test in multiple timezones to catch timezone-related bugs (see issue #123)
        timezone: [UTC, America/New_York, Australia/Sydney]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-build-${{ hashFiles('package-lock.json', '.github/workflows/test.yml') }}
          fail-on-cache-miss: true
      # the browsers are cached, but the system libraries they need are not
      - run: npx playwright install-deps chromium firefox webkit
      - name: Run tests (TZ=${{ matrix.timezone }})
        run: npm test
        env:
          TZ: ${{ matrix.timezone }}

  # cally in each framework, installed as it would be from npm
  frameworks:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        framework: [react, vue, svelte]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # the frameworks' test tooling needs a newer version than cally
          node-version: "24.x"
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run test:frameworks -- ${{ matrix.framework }}
